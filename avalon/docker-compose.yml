# Any VPS with Docker:
#
#   cd avalon && docker compose up -d
#
# Then point a reverse proxy (Caddy, nginx, Traefik) at port 3000. If you use
# nginx, turn buffering off for the SSE endpoint or clients will see nothing
# until the response ends:
#
#   location /api/stream { proxy_pass http://127.0.0.1:3000; proxy_buffering off;
#                          proxy_read_timeout 1h; }
#
# Caddy needs no special configuration.

services:
  avalon:
    build: .
    image: avalon
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - avalon-data:/data
    environment:
      PORT: 3000
      AVALON_STATE: /data/rooms.json

volumes:
  avalon-data:
