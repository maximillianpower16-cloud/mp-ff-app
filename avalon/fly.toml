# Fly.io config. From this directory:
#
#   fly launch --copy-config --no-deploy   # pick a name; it rewrites app =
#   fly deploy
#
# Optional, so rooms survive a redeploy (AVALON_STATE already points at /data):
#
#   fly volumes create avalon_data -s 1
#   ...then uncomment the [[mounts]] block below and redeploy.

app = "avalon"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # Do not let the machine stop under a group mid-game: a suspended process
  # loses every room in memory.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Rooms live in one process's memory — never scale this past a single machine.
# [[mounts]]
#   source = "avalon_data"
#   destination = "/data"
