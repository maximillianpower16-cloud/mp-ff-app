<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1418">
<title>FF 2026 Draft</title>
<style>
:root{
  --ink:#0E1418; --surface:#18222A; --surface2:#1F2C36; --line:#2A3B47;
  --text:#E8EEF2; --muted:#8A9BA8; --dim:#5D707E;
  --amber:#FFB43D; --mint:#4FD6A0; --red:#E5604D;
  --qb:#A78BFA; --rb:#4FD6A0; --wr:#56B7E8; --te:#F0876A; --dst:#7C93A3;
  --up:#90EE90; --down:#F08080;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --round:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --tabh:calc(60px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);font-family:var(--sans);overscroll-behavior-y:none}
body{padding-bottom:var(--tabh)}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input{font-size:16px}

/* ---------- clock header (signature) ---------- */
#clock{position:sticky;top:0;z-index:40;background:rgba(14,20,24,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 14px 9px}
.clockrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.nowpick{font-family:var(--round);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.nowpick small{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:7px}
.until{text-align:right;font-family:var(--round);font-size:13px;font-weight:700;line-height:1.25}
.until b{font-size:20px;color:var(--amber)}
.until.up b{color:var(--mint)}
.until span{display:block;font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
/* pip strip */
#pips{display:flex;gap:3px;margin-top:9px;height:7px;align-items:stretch}
.pip{flex:1;border-radius:2px;background:var(--line);transition:background .18s}
.pip.gone{background:var(--dim)}
.pip.mine{background:var(--amber);box-shadow:0 0 7px rgba(255,180,61,.55)}
.pip.minedone{background:var(--amber);opacity:.35;box-shadow:none}

/* ---------- search ---------- */
#searchwrap{position:sticky;top:0;z-index:30;padding:9px 12px;background:var(--ink);border-bottom:1px solid var(--line);
  display:flex;gap:8px;align-items:center}
.searchbox{position:relative;flex:1;min-width:0}
#search{width:100%;padding:11px 34px 11px 13px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  color:var(--text);font-size:16px;font-weight:500}
#search::placeholder{color:var(--dim)}
#clearsearch{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;font-weight:700}
#clearsearch:active{background:var(--surface2);color:var(--text)}
#historybtn{width:44px;height:44px;flex:0 0 auto;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--muted)}
#historybtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#historybtn:active{background:var(--surface2);color:var(--text)}

/* ---------- chips ---------- */
.chips{display:flex;gap:6px;padding:9px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.01em}
.chip.on{background:var(--text);color:var(--ink);border-color:var(--text)}

/* ---------- recommendation ---------- */
.rec{margin:4px 12px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rechead{padding:9px 13px 7px;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;cursor:pointer}
.recrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line)}
.recrow:last-child{border-bottom:none}
.recmain{flex:1;min-width:0}
.recname{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recwhy{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.recwhy b{color:var(--amber);font-weight:700}
.recv{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--mint);flex:0 0 auto;text-align:right}
.recv span{display:block;font-size:9px;color:var(--dim);letter-spacing:.06em;font-family:var(--sans);font-weight:700}

/* ---------- player rows ---------- */
.tierband{display:flex;align-items:center;gap:8px;padding:13px 13px 5px;font-size:10px;font-weight:800;
  letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.tierband:after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(42,59,71,.55)}
.row:active{background:var(--surface)}
.row.gone{opacity:.32}
.posc{min-width:30px;height:30px;padding:0 5px;flex:0 0 auto;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;letter-spacing:.02em;color:var(--ink)}
.pQB{background:var(--qb)}.pRB{background:var(--rb)}.pWR{background:var(--wr)}.pTE{background:var(--te)}.pDST{background:var(--dst)}
.pmain{flex:1;min-width:0}
.pname{font-size:14.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:0 0 auto}
.pmeta{font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--mono);letter-spacing:-.02em}
.pmeta em{font-style:normal;color:var(--dim)}
.pvorp{font-family:var(--mono);font-size:14px;font-weight:600;text-align:right;flex:0 0 auto;min-width:46px}
.pvorp span{display:block;font-size:9.5px;color:var(--dim);font-family:var(--sans);font-weight:700;margin-top:1px}
.pos-v{color:var(--mint)}.neg-v{color:var(--dim)}
.mine-btn,.taken-btn{width:34px;height:34px;flex:0 0 auto;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-family:var(--round);font-size:16px;font-weight:700}
.mine-btn{border:1.5px solid rgba(255,180,61,.35);color:var(--amber);background:rgba(255,180,61,.08)}
.mine-btn:active{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.taken-btn{border:1.5px solid rgba(229,96,77,.35);color:var(--red);background:rgba(229,96,77,.08)}
.taken-btn:active{background:var(--red);color:var(--ink);border-color:var(--red)}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(6,10,13,.66);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border-radius:20px 20px 0 0;
  border-top:1px solid var(--line);transform:translateY(102%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(14px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grabzone{padding:10px 0 6px;display:flex;justify-content:center;touch-action:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line)}
.shead{padding:6px 18px 12px;touch-action:none}
.sname{font-family:var(--round);font-size:24px;font-weight:800;letter-spacing:-.02em}
.ssub{font-size:12.5px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.snote{margin:0 18px 12px;padding:10px 12px;background:rgba(255,180,61,.1);border-left:2px solid var(--amber);
  border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.42;color:#F2DEBC}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin:0 0 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{background:var(--surface);padding:10px 12px}
.cell b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.02em}
.cell span{display:block;font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:3px}
.acts{display:flex;gap:9px;padding:0 18px}
.act{flex:1;padding:15px;border-radius:13px;font-size:15px;font-weight:750;text-align:center;letter-spacing:-.01em}
.act.taken{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.act.mine{background:var(--amber);color:var(--ink)}
.act.undo{background:var(--surface2);color:var(--red);border:1px solid var(--line)}

/* ---------- toast ---------- */
#toast{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + 12px);z-index:90;background:var(--surface2);
  border:1px solid var(--line);border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:0 8px 26px rgba(0,0,0,.42);
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(14px);
  transition:opacity .18s ease, transform .22s cubic-bezier(.32,.72,0,1), visibility 0s linear .2s}
#toast.on{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0);transition-delay:0s}
body.trayon #toast{bottom:calc(var(--tabh) + 66px)}
#toastmsg{flex:1;font-size:13.5px;font-weight:600;min-width:0}
#toastmsg em{font-style:normal;color:var(--muted);font-weight:500}
#toastundo{font-size:13px;font-weight:800;color:var(--amber);padding:7px 11px;letter-spacing:.02em}

/* ---------- tabs ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;height:var(--tabh);display:flex;
  background:rgba(14,20,24,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;pointer-events:auto;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:9.5px;font-weight:750;letter-spacing:.03em;color:var(--dim);text-transform:uppercase;padding:0 2px}
.tab.on{color:var(--amber)}
.tabi{width:21px;height:21px;display:block}
.tab svg,.tab .tabi{pointer-events:none}
.tabi svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;margin:-16px 0 0 22px;background:var(--amber);color:var(--ink);font-size:9px;font-weight:800;
  padding:1px 5px;border-radius:8px;font-family:var(--mono)}

/* ---------- roster / log ---------- */
.teamtotal{margin:12px 12px 0;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:13px;
  display:flex;align-items:center;justify-content:space-between}
.teamtotal b{display:block;font-family:var(--round);font-size:30px;font-weight:800;color:var(--amber);line-height:1}
.teamtotal b span{display:block;font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;
  letter-spacing:.07em;margin-top:4px;font-family:var(--sans)}
.teamtotal-sub{font-size:12px;font-weight:600;color:var(--muted);text-align:right;line-height:1.4}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:62px}
.slot.empty{border-style:dashed;opacity:.6}
.slotlab{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.slotname{font-size:14px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.slotmeta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.slotarrows{display:flex;gap:6px;margin-top:7px}
.logrow{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid rgba(42,59,71,.5)}
.logpick{font-family:var(--mono);font-size:12px;color:var(--dim);width:42px;flex:0 0 auto}
.logname{flex:1;font-size:14px;font-weight:600}
.logname.mine{color:var(--amber);font-weight:750}
.runs{margin:12px;padding:12px 13px;background:var(--surface);border:1px solid var(--line);border-radius:13px}
.runs h3{margin:0 0 9px;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.runbar{display:flex;gap:4px;align-items:center;margin-bottom:7px}
.runlab{font-family:var(--mono);font-size:11px;width:26px;color:var(--muted)}
.runtrack{flex:1;height:9px;background:var(--ink);border-radius:5px;overflow:hidden}
.runfill{height:100%;border-radius:5px}
.runn{font-family:var(--mono);font-size:11px;width:20px;text-align:right;color:var(--muted)}
.empty-state{padding:44px 26px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.5}

/* compare tray + table */
#tray{position:fixed;left:0;right:0;bottom:var(--tabh);z-index:46;background:var(--surface2);border-top:1px solid var(--line);
  padding:9px 12px calc(9px);display:none;align-items:center;gap:8px}
#tray.on{display:flex}
.trayitem{flex:0 0 auto;background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 10px;
  font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.trayitem b{color:var(--dim);font-weight:800}
.traygo{margin-left:auto;flex:0 0 auto;background:var(--amber);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:800}
.traygo.off{background:var(--surface);color:var(--dim)}
.ctable{width:100%;border-collapse:collapse;font-size:13px}
.ctable th,.ctable td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);
  font-size:12.5px;letter-spacing:-.02em}
.ctable th:first-child,.ctable td:first-child{text-align:left;font-family:var(--sans);color:var(--dim);font-size:11px;
  font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.ctable thead th{font-family:var(--round);font-size:13.5px;font-weight:800;color:var(--text);text-transform:none;letter-spacing:-.01em}
.ctable td.best{color:var(--mint);font-weight:700}
.cnote{font-size:11.5px;line-height:1.45;color:var(--muted);padding:9px 12px;background:rgba(255,180,61,.07);
  border-left:2px solid var(--amber);border-radius:0 7px 7px 0;margin:0 18px 12px}
.selrow{outline:2px solid var(--amber);outline-offset:-2px;border-radius:8px}

/* rank editor */
.rankrow{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid rgba(42,59,71,.5)}
.rnum{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--amber);width:34px;flex:0 0 auto}
.rmain{flex:1;min-width:0}
.rname{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.rbtn{width:31px;height:31px;flex:0 0 auto;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);font-family:var(--round);font-weight:800}
.rbtn:active{background:var(--amber);color:var(--ink)}
.rbtn.sel{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.rbtn.up{color:var(--up);border-color:rgba(144,238,144,.35)}
.rbtn.down{color:var(--down);border-color:rgba(240,128,128,.35)}
.rbtn.sm{width:26px;height:26px;font-size:12px}
.importbox{width:100%;min-height:104px;padding:11px;border-radius:11px;background:var(--ink);border:1px solid var(--line);
  color:var(--text);font-family:var(--mono);font-size:12px;line-height:1.4}
.status{margin:12px;padding:12px 13px;background:var(--surface);border:1px solid var(--line);border-radius:13px;
  font-size:12.5px;line-height:1.5;color:var(--muted)}
.status b{color:var(--text);font-weight:700}

/* settings */
.setrow{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.setrow label{font-size:14px;font-weight:600}
.setrow input{width:74px;padding:8px 10px;border-radius:9px;background:var(--ink);border:1px solid var(--line);color:var(--text);
  text-align:center;font-family:var(--mono);font-weight:600}
.fineprint{padding:14px 18px 4px;font-size:11px;line-height:1.5;color:var(--dim)}
.view{display:none}.view.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="clock">
  <div class="clockrow">
    <div class="nowpick" id="nowpick">1.01<small id="ontheclock">on the clock</small></div>
    <div class="until" id="until"><b>4</b><span>picks till you</span></div>
  </div>
  <div id="pips"></div>
</div>

<!-- DRAFT -->
<div class="view on" id="v-draft">
  <div id="recbox"></div>
  <div id="searchwrap">
    <div class="searchbox">
      <input id="search" placeholder="Search player…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="clearsearch" aria-label="Clear search" style="display:none">✕</button>
    </div>
    <button id="historybtn" aria-label="History"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>

<!-- RANKS -->
<div class="view" id="v-ranks">
  <div class="chips" id="rankchips"></div>
  <div class="chips" id="ranksortchips"></div>
  <div id="ranklist"></div>
</div>

<!-- TEAM -->
<div class="view" id="v-team">
  <div id="teamtotal"></div>
  <div class="slots" id="slots"></div>
  <div id="needs"></div>
</div>


<!-- SETTINGS -->
<div class="view" id="v-set">
  <div id="setfields"></div>
  <div id="datastatus"></div>
  <div style="padding:0 18px 6px"><div class="slotlab" style="margin-bottom:7px">Paste a FantasyPros CSV export</div>
    <textarea class="importbox" id="importbox" placeholder="Paste the whole CSV here — rankings, ADP or projections export. Columns are detected automatically."></textarea>
    <div class="acts" style="padding:8px 0 0"><button class="act mine" id="importbtn">Update players</button></div>
  </div>
  <div class="acts" style="margin-top:16px"><button class="act undo" id="resetbtn">Reset draft</button></div>
  <div class="fineprint" id="fineprint"></div>
</div>

<div id="tray"></div>
<div id="scrim"></div>
<div class="sheet" id="sheet"><div class="grabzone"><div class="grab"></div></div><div id="sheetbody"></div></div>

<div id="toast"><div id="toastmsg"></div><button id="toastundo">Undo</button></div>

<div id="tabs">
  <button class="tab on" data-v="draft"><span class="tabi"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/></svg></span>Draft</button>
  <button class="tab" data-v="ranks"><span class="tabi"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h9M5 18h5"/></svg></span>Ranks</button>
  <button class="tab" data-v="team"><span class="tabi"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 16.8 6.7 19.7l1.1-6.1L3.4 9.4l6-.8z"/></svg></span>Team</button>
  <button class="tab" data-v="set"><span class="tabi"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.4"/><circle cx="15" cy="17" r="2.4"/></svg></span>Setup</button>

function mergeRows(rows, meta){
  let hit=0, added=0;
  for(const r of rows){
    if(!r.name) continue;

    if(!p){
      if(!r.pos) continue;
      p = {n:r.name, p:r.pos, t:r.team||'', adp:null, tier:null, mr:null, pts:null, ppg:null};
      PLAYERS.push(p); added++;
    } else hit++;
    if(r.adp  != null) { p.adp = Math.round(r.adp); p.sd = null; }
    if(r.tier != null) p.tier = r.tier;
    if(r.pts  != null) { p.pts = r.pts; if(p.pg) p.ppg = +(r.pts/p.pg).toFixed(2); }
    if(r.bye  != null) p.bye  = r.bye;
    if(r.team)         p.t    = r.team;
    if(r.pos)          p.p    = r.pos;
  }
  PLAYERS.sort((a,b)=>(a.adp||9999)-(b.adp||9999));
  buildIndex(); buildPosTiers(); REP = replacement();
  dataMeta = {source:meta.source, asOf:meta.asOf, n:PLAYERS.length, matched:hit, added:added};
  LS.set('ff_datameta', dataMeta);

}

/* ---------- CSV import (FantasyPros exports) ---------- */
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return null;
  const cut = l => { const out=[]; let cur='', q=false;
    for(let i=0;i<l.length;i++){ const c=l[i];
      if(c==='"'){ if(q && l[i+1]==='"'){cur+='"';i++;} else q=!q; }
      else if(c===',' && !q){ out.push(cur); cur=''; } else cur+=c; }
    out.push(cur); return out.map(s=>s.trim().replace(/^"|"$/g,'')); };
  let hi = lines.findIndex(l=>/player|name/i.test(l));
  if(hi<0) hi=0;
  const head = cut(lines[hi]).map(h=>h.toUpperCase().trim());
  const find = (...pats) => head.findIndex(h=>pats.some(p=>h===p||h.includes(p)));
  const iName = find('PLAYER NAME','PLAYER','NAME');
  if(iName<0) return null;
  const iAdp=find('AVG','ADP'), iRk=find('RK','RANK'), iTier=find('TIER'),
        iPts=find('FPTS','PROJ PTS','POINTS'), iPos=find('POS'), iTeam=find('TEAM'), iBye=find('BYE');
  const num = v => { const f=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(f)?null:f; };
  const rows=[];
  for(let i=hi+1;i<lines.length;i++){
    const c = cut(lines[i]); if(c.length<2) continue;
    let name = (c[iName]||'').replace(/\s+\([^)]*\)/,'').trim();
    if(!name || /^player/i.test(name)) continue;
    let pos = iPos>=0 ? (c[iPos]||'').replace(/[0-9]/g,'').trim().toUpperCase() : null;
    let team = iTeam>=0 ? (c[iTeam]||'').trim().toUpperCase() : null;
    if(!team){ const m = name.match(/\s([A-Z]{2,3})$/); if(m){ team=m[1]; name=name.slice(0,-m[0].length).trim(); } }
    let adp = iAdp>=0 ? num(c[iAdp]) : null;
    if(adp==null && iRk>=0) adp = num(c[iRk]);
    rows.push({name, pos:pos||null, team:team||null, adp,
      tier: iTier>=0? num(c[iTier]) : null,
      pts:  iPts>=0 ? num(c[iPts])  : null,
      bye:  iBye>=0 ? num(c[iBye])  : null});
  }
  return rows.length? rows : null;
}
function doImport(){
  const box = document.getElementById('importbox');
  const rows = parseCSV(box.value||'');
  if(!rows){ showToast('Could not read that. It needs a header row with a player-name column.', false, true); return; }
  const {hit, added} = mergeRows(rows, {source:'CSV paste', asOf:new Date().toLocaleDateString()});

}

/* ---------- draft math ---------- */
const fmtPick = o => o? (Math.floor((o-1)/cfg.teams)+1)+'.'+String(((o-1)%cfg.teams)+1).padStart(2,'0') : '—';
const myPickInRound = r => (r%2===1) ? cfg.slot : cfg.teams+1-cfg.slot;
function myPicks(){ const a=[]; for(let r=1;r<=cfg.rounds;r++) a.push((r-1)*cfg.teams + myPickInRound(r)); return a; }
const currentPick = ()=> picks.length+1;
function nextMine(){ return myPicks().find(p=>p>=currentPick()) || null; }
function nextNextMine(){ const m=myPicks().filter(p=>p>=currentPick()); return m[1]||null; }

/* replacement level: fill every starting slot in the league by projected points */
function replacement(){
  const gone = new Set(picks.map(p=>p.n));
  const pool = PLAYERS.filter(p=>p.pts).sort((a,b)=>b.pts-a.pts);
  const need = {QB:cfg.QB*cfg.teams, RB:cfg.RB*cfg.teams, WR:cfg.WR*cfg.teams, TE:cfg.TE*cfg.teams};
  let flex = cfg.FLEX*cfg.teams, sf = cfg.SF*cfg.teams;
  const taken = {QB:0,RB:0,WR:0,TE:0}; const last = {};
  for(const p of pool){
    const pos = p.p; if(!(pos in need)) continue;
    let used=false;
    if(need[pos]>0){ need[pos]--; used=true; }
    else if(flex>0 && pos!=='QB'){ flex--; used=true; }
    else if(sf>0){ sf--; used=true; }
    if(used){ taken[pos]++; last[pos]=p.pts; }
    if(need.QB+need.RB+need.WR+need.TE+flex+sf===0) break;
  }
  // replacement = best player at that position who did NOT make a starting slot
  const rep={};
  for(const pos of ['QB','RB','WR','TE']){
    const rest = pool.filter(p=>p.p===pos && p.pts < (last[pos]??0));
    rep[pos] = rest.length? rest[0].pts : (last[pos]??0);
  }
  return rep;
}
let REP = replacement();
const vorp = p => p.pts ? Math.round(p.pts - (REP[p.p]||0)) : null;

/* ADP uncertainty: observed spread across snapshots is far too tight late,
   so floor it with a width that grows with ADP. Modeled, not measured. */
const sdOf = p => Math.max(p.sd||0, 1.15*Math.sqrt(p.adp||1));
const ncdf = z => { const t=1/(1+.2316419*Math.abs(z)); const d=.3989423*Math.exp(-z*z/2);
  let pr=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0? 1-pr : pr; };
/* P(still on the board when pick `at` arrives) */
function pAvail(p, at){
  if(!at || !p.adp) return 0;
  return Math.max(0, Math.min(1, 1 - ncdf((at - 0.5 - p.adp)/sdOf(p))));
}
const available = ()=>{ const gone=new Set(picks.map(x=>x.n)); return PLAYERS.filter(p=>!gone.has(p.n)); };

/* expected best VORP at a position when my next pick arrives */
function expectedBest(pos, at){
  const cands = available().filter(p=>p.p===pos && vorp(p)!==null).sort((a,b)=>vorp(b)-vorp(a)).slice(0,25);
  let carry=1, e=0;
  for(const c of cands){ const pa=pAvail(c,at); e += vorp(c)*pa*carry; carry *= (1-pa); if(carry<.01) break; }
  return e;
}
/* what it costs me to wait one round on this player's position */
function waitCost(p){
  const nn = nextNextMine();
  if(!nn) return 0;
  return Math.round(vorp(p) - expectedBest(p.p, nn));
}

/* myOrder is the manual priority order used to fill slots — new picks are
   appended automatically (best proj pts first), and it's reorderable from
   the Team tab, which is what decides who starts vs. sits the bench. */
function syncMyOrder(){
  const mineNames = picks.filter(p=>p.mine).map(p=>p.n);
  const mineSet = new Set(mineNames);
  myOrder = myOrder.filter(n=>mineSet.has(n));
  const missing = mineNames.filter(n=>!myOrder.includes(n));
  missing.sort((a,b)=>((byName[b]&&byName[b].pts)||0)-((byName[a]&&byName[a].pts)||0));
  myOrder = myOrder.concat(missing);
  LS.set('ff_myorder', myOrder);
}
function customFromPick(name){
  const pk = picks.find(x=>x.n===name && x.mine && x.cp);
  return pk ? {n:pk.n, p:pk.cp, t:'', pts:0, ppg:null, custom:true} : null;
}
function moveMyOrder(name, dir){
  const i = myOrder.indexOf(name); if(i<0) return;
  const j = i+dir; if(j<0 || j>=myOrder.length) return;
  const tmp=myOrder[i]; myOrder[i]=myOrder[j]; myOrder[j]=tmp;
  LS.set('ff_myorder', myOrder); render();
}
function myRoster(){
  syncMyOrder();
  const pool = myOrder.map(n=> byName[n] || customFromPick(n)).filter(Boolean);
  const slots=[];
  const push=(lab,allow)=>{ const i=pool.findIndex(p=>allow.includes(p.p));
    slots.push({lab, p: i>=0? pool.splice(i,1)[0] : null}); };
  for(let i=0;i<cfg.QB;i++) push('QB',['QB']);
  for(let i=0;i<cfg.RB;i++) push('RB',['RB']);
  for(let i=0;i<cfg.WR;i++) push('WR',['WR']);
  for(let i=0;i<cfg.TE;i++) push('TE',['TE']);
  for(let i=0;i<cfg.FLEX;i++) push('FLEX',['RB','WR','TE']);
  for(let i=0;i<cfg.SF;i++) push('SUPERFLEX',['QB','RB','WR','TE']);
  for(let i=0;i<(cfg.DST||0);i++) push('DEF',['DST']);
  for(let i=0;i<(cfg.K||0);i++) push('K',['K']);
  const bench=[];
  for(let i=0;i<(cfg.BENCH||0);i++) bench.push({lab:'BENCH '+(i+1), p: pool.length? pool.shift() : null});
  return {slots, bench, extra:pool};
}

function renderClock(){
  const cur=currentPick(), nm=nextMine(), nn=nextNextMine();
  document.getElementById('nowpick').innerHTML = fmtPick(cur)+'<small>'+(cur===nm?'you are up':'on the clock')+'</small>';
  const away = nm? nm-cur : null;
  const u=document.getElementById('until');
  if(nm===null){ u.innerHTML='<b>—</b><span>draft done</span>'; }
  else if(away===0){ u.className='until up'; u.innerHTML='<b>NOW</b><span>your pick</span>'; }
  else { u.className='until'; u.innerHTML='<b>'+away+'</b><span>pick'+(away===1?'':'s')+' till you</span>'; }

  // pip strip: this pick through my next-next pick
  const end = nn || nm || cur;
  const start = Math.max(1, cur - 2);
  const pips=[];
  for(let i=start;i<=Math.min(end, start+31);i++){
    let c='pip';
    if(i<cur) c+=' gone';
    if(i===nm) c+=' mine';
    if(i===nn) c+=' mine';
    if(i<cur && myPicks().includes(i)) c='pip minedone';
    pips.push('<div class="'+c+'"></div>');
  }
  document.getElementById('pips').innerHTML = pips.join('');
}

let recCollapsed = LS.get('ff_reccollapsed', false);

function renderRecs(){
  const box=document.getElementById('recbox'), cur=currentPick(), nm=nextMine();
  if(query){ box.innerHTML=''; return; }
  const onClock = (nm===cur);
  const avail = available();
  const top = ['QB','RB','WR','TE','DST'].map(pos=>{
    const cands = avail.filter(p=>p.p===pos && vorp(p)!==null);
    if(!cands.length) return null;
    cands.sort((a,b)=>(mrOf(a)||9999)-(mrOf(b)||9999));
    const p = cands[0];
    return {p, v:vorp(p), pa:pAvail(p, nextNextMine())};
  }).filter(Boolean);
  if(!top.length){ box.innerHTML=''; return; }
  const chev = recCollapsed ? '▸' : '▾';
  const head = '<div class="rechead" data-toggle-rec="1"><span>'+(onClock?'Take one of these':'If the pick came to you now')+'</span><span>'+chev+' '+fmtPick(cur)+'</span></div>';
  if(recCollapsed){ box.innerHTML = '<div class="rec">'+head+'</div>'; return; }
  const rows = top.map(t=>{
    const why = [Math.round(t.pa*100)+'% to last till '+fmtPick(nextNextMine()), (t.p.ppg??'—')+' ppg'];
    return '<div class="recrow" data-n="'+esc(t.p.n)+'">'+
      '<div class="posc p'+t.p.p+'">'+posLabel(t.p.p)+(mrOf(t.p)||'')+'</div>'+
      '<div class="recmain"><div class="recname">'+t.p.n+' <span style="color:var(--dim);font-weight:600;font-size:12px">'+(t.p.t||'FA')+'</span></div>'+
      '<div class="recwhy">'+why.join(' · ')+'</div></div>'+
      '<div class="recv">'+t.v+'<span>VORP</span></div></div>';
  }).join('');
  box.innerHTML='<div class="rec">'+head+rows+'</div>';
}

/* canonical manual-rank order — always used for editing/committing, never re-sorted for display */
function rankedList(pos){
  const list = PLAYERS.filter(p=>p.p===pos);
  list.sort((a,b)=>(mrOf(a)||9999)-(mrOf(b)||9999));
  return list;
}
const RANK_SORTS = [['mine','My Rank'],['adp','ADP'],['ppg','Proj PPG'],['ly','Last Yr PPG'],['l8','Last 8 PPG'],['vorp','VORP']];
/* what's actually rendered — a copy, re-sorted for browsing, that never feeds back into the manual ranks */
function displayRankList(pos){
  const list = rankedList(pos).slice();
  if(rankSort==='adp')       list.sort((a,b)=>(a.adp||9999)-(b.adp||9999));
  else if(rankSort==='ppg')  list.sort((a,b)=>(b.ppg??-999)-(a.ppg??-999));
  else if(rankSort==='ly')   list.sort((a,b)=>(b.lyPPG??-999)-(a.lyPPG??-999));
  else if(rankSort==='l8')   list.sort((a,b)=>(b.l8PPG??-999)-(a.l8PPG??-999));
  else if(rankSort==='vorp') list.sort((a,b)=>(vorp(b)??-999)-(vorp(a)??-999));
  return list;
}
function commitOrder(pos, list){
  list.forEach((p,i)=>{ ranks[p.n] = i+1; });
  LS.set('ff_ranks', ranks); render();
}
function moveRank(name, dir){
  const p = byName[name]; if(!p) return;
  const list = rankedList(p.p);
  const i = list.findIndex(x=>x.n===name); if(i<0) return;
  const j = dir==='top' ? 0 : i+dir;
  if(j<0 || j>=list.length) return;
  list.splice(i,1); list.splice(j,0,p);
  commitOrder(p.p, list);
}

function openCompare(){
  if(cmp.length<2) return;

    ['Tgt share',  p=>p.tsh!=null? +(p.tsh*100).toFixed(1):null,'hi'],
    ['Carries',    p=>p.car,                   'hi'],
    ['O-line',     p=>p.ol,                    'lo'],
    ['Age',        p=>p.age,                   'lo'],
    ['Bye',        p=>p.bye,                   null],
  ];
  let body = '<div class="shead"><div class="sname">Head to head</div>'+
    '<div class="ssub">'+ps.map(p=>p.p+' · '+(p.t||'FA')).join('   vs   ')+'</div></div>';
  body += '<div style="padding:0 12px 12px"><table class="ctable"><thead><tr><th></th>'+
    ps.map(p=>'<th>'+p.n.split(' ').slice(-1)[0]+'</th>').join('')+'</tr></thead><tbody>';
  for(const [lab, fn, dir] of rows){
    const vals = ps.map(fn);
    const nums = vals.filter(v=>typeof v==='number');
    let best=null;
    if(dir && nums.length>1) best = dir==='hi'? Math.max(...nums) : Math.min(...nums);
    body += '<tr><td>'+lab+'</td>'+ vals.map(v=>
      '<td'+(best!=null && v===best?' class="best"':'')+'>'+(v==null||v===''?'—':v)+'</td>').join('') +'</tr>';
  }
  body += '</tbody></table></div>';

  if(notes.length) body += notes.map(p=>'<div class="cnote"><b>'+p.n+'</b> — '+p.note+'</div>').join('');
  const samePos = ps.every(p=>p.p===ps[0].p);
  body += samePos
    ? '<div class="acts"><button class="act mine" id="cmprank">Rank them in this order</button></div>'+

      ', keeping everyone else where they are.</div>'
    : '<div class="fineprint">Mixed positions, so there is no single order to apply. Rank within a position from the Ranks tab.</div>';
  document.getElementById('sheetbody').innerHTML = body;
  document.getElementById('sheet').classList.add('on');

}
function applyCompareOrder(){
  const ps = cmp.map(n=>byName[n]).filter(Boolean);
  if(!ps.length || !ps.every(p=>p.p===ps[0].p)) return;
  const pos = ps[0].p;
  const list = rankedList(pos);
  const slots = ps.map(p=>list.findIndex(x=>x.n===p.n)).filter(i=>i>=0).sort((a,b)=>a-b);
  const rest = list.filter(x=>!cmp.includes(x.n));
  const out=[]; let ri=0, si=0;
  for(let i=0;i<list.length;i++){
    if(si<slots.length && slots[si]===i){ out.push(ps[si]); si++; }
    else out.push(rest[ri++]);
  }
  commitOrder(pos, out.filter(Boolean));
  closeSheet(); showToast('Your '+pos+' order updated', true, true);
}

        : '<div class="slotname" style="color:var(--dim);font-weight:600">—</div>')+'</div>';

/* pairs same-label starter slots together (so e.g. the two RB spots sit
   side by side); an odd one out spans the full row instead of pairing
   awkwardly with the next position group */
function groupedSlotsHTML(list){
  let html='', i=0;
  while(i<list.length){
    const lab=list[i].lab, group=[];
    while(i<list.length && list[i].lab===lab){ group.push(list[i]); i++; }
    group.forEach((s,gi)=>{ html += slotCard(s, group.length%2===1 && gi===group.length-1); });
  }
  return html;
}

  const nn=nextNextMine(), v=vorp(p);
  const stat=(a,b)=>'<div class="cell"><b>'+a+'</b><span>'+b+'</span></div>';
  let h='<div class="shead"><div class="sname">'+p.n+'</div>'+
    '<div class="ssub">'+posLabel(p.p)+(mrOf(p)?' · my '+posLabel(p.p)+mrOf(p):'')+' · '+(p.t||'FA')+' · ADP '+fmtPick(p.adp)+
    (posTier(p)?' · tier '+posTier(p):'')+(p.bye?' · bye '+p.bye:'')+(p.flag?' · '+p.flag:'')+'</div></div>';
  if(p.note) h+='<div class="snote">'+p.note+(p.dlt?' <b>('+(p.dlt>0?'+':'')+p.dlt+' proj pts)</b>':'')+'</div>';
  h+='<div class="grid">'+
    stat(v??'—','VORP')+stat(p.ppg??'—','proj ppg')+stat(p.pts??'—','proj pts')+
    stat(p.lyPPG??'—','last yr ppg')+stat(p.l8PPG??'—','last 8 ppg')+stat(p.pg??'—','proj games')+
    stat(nn?Math.round(pAvail(p,nn)*100)+'%':'—','back at '+fmtPick(nn))+
    stat(gone?'—':waitCost(p),'cost to wait')+stat(p.ol??'—','O-line')+
    stat(p.tsh!=null?(p.tsh*100).toFixed(1)+'%':'—','proj tgt shr')+stat(p.car??'—','proj carries')+stat(p.age??'—','age')+
  '</div>';
  h += gone
    ? '<div class="acts"><button class="act undo" data-undoname="'+esc(p.n)+'">Put back on the board</button></div>'
    : '<div class="acts"><button class="act taken" data-take="'+esc(p.n)+'">Taken</button>'+
      '<button class="act mine" data-takemine="'+esc(p.n)+'">I drafted him</button></div>';
  document.getElementById('sheetbody').innerHTML=h;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeSheet(){ historyOpen=false; document.getElementById('sheet').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); }

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t=e.target;
  const mineBtn=t.closest('[data-mine]');
  if(mineBtn){ e.stopPropagation(); draftPlayer(mineBtn.dataset.mine, true); return; }
  const takeBtn=t.closest('[data-take]');
  if(takeBtn){ e.stopPropagation(); draftPlayer(takeBtn.dataset.take, false); return; }
  if(t.closest('[data-toggle-rec]')){ recCollapsed=!recCollapsed; LS.set('ff_reccollapsed', recCollapsed); renderRecs(); return; }
  if(t.closest('#historybtn')){ openHistory(); return; }
  if(t.id==='clearsearch'){ const inp=document.getElementById('search'); inp.value=''; query='';
    t.style.display='none'; renderRecs(); renderList(); inp.focus(); return; }
  if(t.closest('#slotstoggle')){ slotsCollapsed=!slotsCollapsed; LS.set('ff_slotscollapsed', slotsCollapsed); renderSet(); return; }
  const rmain=t.closest('.rmain');
  if(rmain && rmain.dataset.n){ cmpMode? toggleCmp(rmain.dataset.n) : openSheet(rmain.dataset.n); return; }
  const row=t.closest('.row,.recrow');
  if(row && row.dataset.n){ cmpMode? toggleCmp(row.dataset.n) : openSheet(row.dataset.n); return; }
  if(t.dataset.takemine){ draftPlayer(t.dataset.takemine,true); return; }
  if(t.dataset.undoname){ const i=picks.findIndex(x=>x.n===t.dataset.undoname);
    if(i>=0){ picks.splice(i,1); REP=replacement(); save(); closeSheet(); render(); } return; }
  if(t.dataset.f){ filter=t.dataset.f; renderChips(); renderList(); return; }
  if(t.dataset.s){ sortMode = {vorp:'adp', adp:'mine', mine:'ppg', ppg:'vorp'}[sortMode]; renderChips(); renderList(); return; }
  if(t.id==='scrim'){ closeSheet(); return; }
  if(t.id==='toastundo'){ undoLast(); return; }
  if(t.id==='undorow'){ undoLast(); return; }
  if(t.dataset.cp){ customPos=t.dataset.cp; renderList(); return; }
  if(t.dataset.cmp){ cmpMode=!cmpMode; if(!cmpMode) cmp=[]; renderChips(); renderRanks(); renderTray(); renderList(); return; }
  if(t.dataset.pick){ toggleCmp(t.dataset.pick); return; }
  if(t.dataset.drop){ toggleCmp(t.dataset.drop); return; }
  if(t.id==='cmpgo'){ openCompare(); return; }
  if(t.id==='cmprank'){ applyCompareOrder(); return; }
  if(t.dataset.rp){ rankPos=t.dataset.rp; renderRanks(); return; }
  if(t.dataset.rankedit){ rankEdit=!rankEdit; renderRanks(); return; }
  if(t.dataset.rsort){ rankSort=t.dataset.rsort; if(rankSort!=='mine') rankEdit=false; renderRanks(); return; }
  if(t.dataset.mv){ moveRank(t.dataset.mv, parseInt(t.dataset.d,10)); return; }
  if(t.dataset.rmv){ moveMyOrder(t.dataset.rmv, parseInt(t.dataset.rd,10)); return; }
  if(t.id==='importbtn'){ doImport(); return; }
  if(t.dataset.addtaken){ draftCustom(t.dataset.addtaken,false); return; }
  if(t.dataset.addmine){ draftCustom(t.dataset.addmine,true); return; }
  if(t.id==='resetbtn'){
    if(t.dataset.armed==='1'){
      picks=[]; REP=replacement(); save(); render();
      t.dataset.armed=''; t.textContent='Reset draft';
      showToast('Draft cleared \u2014 back to '+fmtPick(1), false, true);
    } else {
      t.dataset.armed='1'; t.textContent='Tap again to clear all '+picks.length+' picks';
      setTimeout(()=>{ t.dataset.armed=''; t.textContent='Reset draft'; }, 4000);
    }
    return; }
  const tab=t.closest('.tab');
  if(tab){ document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===tab));
    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+tab.dataset.v));
    if(tab.dataset.v==='set') renderSet();
    if(tab.dataset.v!=='ranks' && rankEdit){ rankEdit=false; renderRanks(); }
    window.scrollTo(0,0); return; }
});
document.getElementById('search').addEventListener('input', e=>{
  query=e.target.value.trim();
  document.getElementById('clearsearch').style.display = e.target.value ? 'flex' : 'none';
  renderRecs(); renderList();
});
document.getElementById('search').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ const first=document.querySelector('#list .row'); if(first){ openSheet(first.dataset.n); e.target.blur(); } }
});
document.addEventListener('input', e=>{
  if(e.target.dataset.cfg){ const v=parseInt(e.target.value||'0',10);
    if(!isNaN(v)&&v>=0){ cfg[e.target.dataset.cfg]=v; REP=replacement(); save(); render(); } }
});

/* swipe-down-to-dismiss on the bottom sheet, grabbed from the handle or the header */
(function(){
  const sheetEl = document.getElementById('sheet');
  let startY=null, dy=0, dragging=false, pid=null;
  const isHandle = t => t && t.closest && (t.closest('.grabzone') || t.closest('.shead'));
  sheetEl.addEventListener('pointerdown', e=>{
    if(!isHandle(e.target)) return;
    dragging=true; startY=e.clientY; dy=0; pid=e.pointerId;
    if(sheetEl.setPointerCapture) sheetEl.setPointerCapture(pid);
    sheetEl.style.transition='none';
  });
  sheetEl.addEventListener('pointermove', e=>{
    if(!dragging || e.pointerId!==pid) return;
    dy = Math.max(0, e.clientY - startY);
    sheetEl.style.transform='translateY('+dy+'px)';
  });
  const endDrag = e=>{
    if(!dragging || (e && e.pointerId!==pid)) return;
    dragging=false;
    sheetEl.style.transition='';
    sheetEl.style.transform='';
    if(dy>90) closeSheet();
    dy=0;
  };
  sheetEl.addEventListener('pointerup', endDrag);
  sheetEl.addEventListener('pointercancel', endDrag);
})();

render();
loadRemote();
setInterval(loadRemote, 6*60*60*1000);   // re-check a few times a day if the tab stays open
</script>
