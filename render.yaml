# Render Blueprint for the Avalon app in avalon/.
#
# Render only reads this file from the repository root, which is why it lives
# here rather than beside the app. It has no effect on anything else in the
# repo — the draft board at the root is a static page and Render never sees it.
#
# One-click: https://render.com/deploy?repo=https://github.com/maximillianpower16-cloud/mp-ff-app
services:
  - type: web
    name: avalon
    runtime: node
    rootDir: avalon
    plan: free
    buildCommand: echo "no build step"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"

# Free instances sleep after ~15 minutes idle and lose their filesystem, which
# ends any game in progress. For a machine that stays up and keeps its rooms
# across restarts, switch to a paid plan and add:
#
#     plan: starter
#     disk:
#       name: avalon-data
#       mountPath: /var/data
#       sizeGB: 1
#     envVars:
#       - key: AVALON_STATE
#         value: /var/data/rooms.json
#
# Run exactly one instance either way — rooms live in that process's memory.
