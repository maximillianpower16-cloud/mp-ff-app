name: Avalon tests

on:
  push:
    paths: ['avalon/**', '.github/workflows/avalon-tests.yml']
  pull_request:
    paths: ['avalon/**', '.github/workflows/avalon-tests.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avalon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The rules engine: role dealing, per-player knowledge filtering, and
      # every win condition. Roles are dealt randomly, so run it more than once.
      - name: Rules tests
        run: |
          for i in 1 2 3 4 5; do
            npm run test:rules || exit 1
          done

      # Boots the real server and plays a full five-player game over HTTP,
      # asserting that no client is ever sent another player's role.
      - name: End-to-end
        run: npm run test:e2e
